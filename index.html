<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monde du Pompier - Connexion</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
  <!-- Navigation -->
  <nav class="border-b border-slate-800 bg-slate-900 p-4 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🚒</span>
      <h1 class="font-bold text-xl text-red-500">Monde du Pompier</h1>
    </div>
    <div class="space-x-4">
      <a href="cours/index.html" class="hover:text-red-400">Cours</a>
      <a href="questionnaire/index.html" class="hover:text-red-400">Quiz</a>
    </div>
  </nav>

  <!-- Formulaire -->
  <main class="max-w-md w-full mx-auto p-6 bg-slate-800 rounded-xl border border-slate-700 my-10 shadow-xl">
    <h2 id="form-title" class="text-2xl font-bold text-center text-red-500 mb-6">Connexion</h2>
    
    <form id="auth-form" class="space-y-4">
      <div id="grade-field" class="hidden">
        <label class="block text-sm font-medium mb-1">Statut / Grade</label>
        <select id="user-status" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          <option value="JSP">JSP (Jeune Sapeur-Pompier)</option>
          <option value="SPV">SPV (Sapeur-Pompier Volontaire)</option>
          <option value="SPP">SPP (Sapeur-Pompier Professionnel)</option>
          <option value="SPM">SPM (Militaire / BSPP / BMPM)</option>
          <option value="Militaire">Militaire (Terre / Air / Mer)</option>
          <option value="Civil">Civil / Passionné</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Adresse Email</label>
        <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Mot de passe</label>
        <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded transition">
        Se connecter
      </button>
    </form>

    <div class="mt-4 text-center">
      <button id="toggle-auth" class="text-sm text-slate-400 hover:text-white underline">
        Pas encore de compte ? S'inscrire
      </button>
    </div>
  </main>

  <footer class="border-t border-slate-800 p-4 text-center text-xs text-slate-500">
    © Monde du Pompier - Communauté Théorique & Pratique
  </footer>

  <!-- Script Firebase intégré directement ici -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBaJBHBzjW5sGtZqVwY1CMx7PkQ6AiDgno",
      authDomain: "monde-du-pompier.firebaseapp.com",
      databaseURL: "https://monde-du-pompier-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "monde-du-pompier",
      storageBucket: "monde-du-pompier.appspot.com",
      messagingSenderId: "1036756593120",
      appId: "1:1036756593120:web:41a3a9f5a06bdee5aee385",
      measurementId: "G-7H9KSM9JVF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let isSignup = false;

    const toggleBtn = document.getElementById('toggle-auth');
    const gradeField = document.getElementById('grade-field');
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');

    toggleBtn?.addEventListener('click', () => {
      isSignup = !isSignup;
      formTitle.textContent = isSignup ? "Inscription" : "Connexion";
      submitBtn.textContent = isSignup ? "S'inscrire" : "Se connecter";
      gradeField.classList.toggle('hidden', !isSignup);
      toggleBtn.textContent = isSignup ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
    });

    document.getElementById('auth-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        if (isSignup) {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const status = document.getElementById('user-status').value;
          
          await set(ref(db, 'users/' + userCredential.user.uid), {
            email: email,
            status: status,
            role: 'membre',
            createdAt: new Date().toISOString()
          });

          alert("Compte créé avec succès !");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          alert("Connexion réussie !");
        }
        window.location.href = "cours/index.html";
      } catch (error) {
        alert("Erreur : " + error.message);
      }
    });
  </script>
</body>
</html>
